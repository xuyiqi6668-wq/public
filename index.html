<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby Diary</title>
  <meta name="description" content="A personal photo diary of our baby growing up.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">Our baby diary</p>
      <h1 id="baby-name">Little One</h1>
      <p id="tagline" class="tagline"></p>
      <div class="stats">
        <div class="stat"><span id="age" class="stat-num">–</span><span class="stat-label">old today</span></div>
        <div class="stat"><span id="post-count" class="stat-num">0</span><span class="stat-label">memories</span></div>
        <div class="stat"><span id="photo-count" class="stat-num">0</span><span class="stat-label">photos</span></div>
      </div>
    </div>
  </header>

  <nav class="toolbar wrap" aria-label="Filters">
    <div class="views" role="tablist">
      <button class="view-btn active" data-view="timeline" role="tab" aria-selected="true">Timeline</button>
      <button class="view-btn" data-view="gallery" role="tab" aria-selected="false">All photos</button>
    </div>
    <input id="search" type="search" placeholder="Search memories…" aria-label="Search memories">
    <a class="add-btn" href="upload.html">＋ Add memory</a>
    <div id="tags" class="tags"></div>
  </nav>

  <main class="wrap">
    <section id="timeline" class="timeline"></section>
    <section id="gallery" class="gallery" hidden></section>
    <p id="empty" class="empty" hidden>No memories match. Try another search.</p>
  </main>

  <footer class="wrap footer">
    Made with love by <span id="author"></span> · <span id="year"></span>
  </footer>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-prev" aria-label="Previous photo">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-next" aria-label="Next photo">›</button>
  </div>

  <script src="data/posts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
